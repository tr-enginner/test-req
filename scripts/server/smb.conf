[global]
workgroup = WORKGROUP
server string = Matrix Agent File Server
server role = standalone server
log file = /dev/stdout
max log size = 0
map to guest = Bad User
security = user

# Disable printing
load printers = no
printing = bsd
printcap name = /dev/null

# Performance tuning
socket options = TCP_NODELAY IPTOS_LOWDELAY

[matrix-projects]
path = /data/matrix-projects
browsable = yes
writable = yes
guest ok = no
create mask = 0644
directory mask = 0755
valid users = @matrix
force group = matrix
comment = Matrix Agent project files
