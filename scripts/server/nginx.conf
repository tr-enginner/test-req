# Matrix Agent — Nginx reverse proxy (Docker version)
#
# Key difference from bare-metal nginx-main.conf:
#   - Uses Docker's embedded DNS resolver (127.0.0.11) so that
#     dynamically-created opencode containers can be resolved by name.
#   - proxy_pass uses a variable to force runtime DNS resolution
#     (static hostnames in proxy_pass are resolved once at startup and cached).
#   - proxy_pass must NOT include a URI path when using variables,
#     otherwise nginx replaces the entire request URI instead of appending.

# ── Manager portal (port 80) ──────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Docker embedded DNS — required for resolving dynamic container names
    resolver 127.0.0.11 valid=10s;

    # OpenCode JSON Schema — browser must reach this URL offline (public DNS for opencode.ai does not point here).
    # Set MATRIX_PORTAL_PUBLIC_URL in .env so opencode.json $schema uses this path (HTTP, no cert issues).
    location = /matrix-opencode-schema/config.json {
        # Compose service name (embedded DNS)
        set $schema_upstream opencode-schema-mirror;
        proxy_pass http://$schema_upstream:80/config.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Proxy all manager routes (login, logout, admin, projects, api, etc.)
    location / {
        set $upstream_manager matrix-manager;
        proxy_pass http://$upstream_manager:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2048m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}

# ── Per-user/project instances (generated by manager, each on its own port) ──
include /etc/nginx/conf.d/matrix.d/*.conf;
