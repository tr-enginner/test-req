# Matrix Agent — Nginx main configuration template
#
# Install to /etc/nginx/conf.d/matrix.conf (or include from nginx.conf).
# The manager service auto-generates per-instance fragments in /opt/matrix/nginx.d/.
#
# After installing, run: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # ── Project management portal ──
    location /projects/ {
        proxy_pass http://127.0.0.1:3000/projects/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect bare /projects to /projects/
    location = /projects {
        return 301 /projects/;
    }

    # ── JSON API ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Per-user OpenCode instances (auto-generated by manager.ts) ──
    include /opt/matrix/nginx.d/*.conf;
}
