# HTTP — for internal proxy (matrix-nginx → mirror) without TLS; also avoids browser TLS errors on $schema.
server {
    listen 80;
    server_name opencode.ai _;

    location = /config.json {
        default_type application/json;
        alias /usr/share/nginx/html/config.json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    location / {
        return 404;
    }
}

# TLS mirror for opencode.ai — OpenCode server-side (Node/Bun) fetches https://opencode.ai/config.json
server {
    listen 443 ssl;
    server_name opencode.ai;

    ssl_certificate     /etc/nginx/ssl/opencode.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/opencode.ai.key;

    # Mounted JSON (official schema bundle or pre-downloaded config.json)
    location = /config.json {
        default_type application/json;
        alias /usr/share/nginx/html/config.json;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        return 404;
    }
}
